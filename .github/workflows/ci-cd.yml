name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ghcr.io/your-username/clash-royale-deck-builder
  DOCKER_TAG: ${{ github.sha }}
  JWT_SECRET_KEY: test-secret-key-for-ci-minimum-32-characters-long
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
  GOOGLE_CLIENT_ID: test-client-id
  GOOGLE_CLIENT_SECRET: test-client-secret
  CORS_ORIGINS: http://localhost:3000
  ENVIRONMENT: test
  DEBUG: false
  LOG_LEVEL: info

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install uv
      run: |
        pip install uv

    - name: Install dependencies
      run: |
        cd backend
        uv sync
    
    - name: Run unit and contract tests
      working-directory: backend
      run: uv run pytest tests/unit/ tests/contract/ -v --tb=short --cov=./ --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: true

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
    
    - name: Deploy to production
      if: github.ref == 'refs/heads/main'
      run: |
        # Add your deployment commands here
        echo "Deploying to production..."
        # Example: ssh user@server "docker-compose pull && docker-compose up -d"
